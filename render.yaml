# Render Blueprint: website + background worker + PostgreSQL 18, all in Frankfurt.
# Render dashboard → New → Blueprint → choose this GitHub repository → Apply.
#
# Payments and messages start in mock (test) mode: no business registration is
# needed, but no real money is collected either. Switch each one to live in the
# Render dashboard (Environment) once your accounts are approved; see README.

databases:
  - name: pesaflow-db
    databaseName: pesaflow
    user: pesaflow
    region: frankfurt
    postgresMajorVersion: "18"

services:
  - type: web
    name: pesaflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pesaflow-db
          property: connectionString
      - key: JOBS_INLINE
        value: "0"
      - key: MPESA_ENV
        value: mock
      - key: PADDLE_ENV
        value: mock
      - key: FLW_ENV
        value: mock
      - key: NOTIFY_ENV
        value: mock
      - key: ADMIN_EMAILS
        value: gregoryokwaro@gmail.com

  - type: worker
    name: pesaflow-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pesaflow-db
          property: connectionString
      - key: MPESA_ENV
        value: mock
      - key: PADDLE_ENV
        value: mock
      - key: FLW_ENV
        value: mock
      - key: NOTIFY_ENV
        value: mock
      - key: ADMIN_EMAILS
        value: gregoryokwaro@gmail.com
